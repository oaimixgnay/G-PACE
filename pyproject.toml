[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g-pace"
version = "0.2.2"
description = "Phenology-informed maize yield prediction and environment-specific selection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
train = ["torch>=2.2", "catboost>=1.2.8", "optuna>=4.0"]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
